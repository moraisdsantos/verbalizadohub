name: Backup diário do catálogo de áudio

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backup-and-build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Gerar snapshot das obras publicadas
        run: node scripts/update-audio-backup.mjs

      - name: Salvar snapshot no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio-catalog-backup.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
            exit 0
          fi
          git commit -m "Atualiza backup diário do catálogo de áudio"
          git push origin HEAD:main

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação com o novo snapshot
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos de publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: backup-and-build
    steps:
      - name: Publicar snapshot no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
